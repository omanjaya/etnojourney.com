# Weekly dependency updates, grouped so they arrive as a few PRs that the
# required CI check validates before merge. Security updates are separate and
# immediate (enabled in the repository settings).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
    # Framework majors need a manual migration pass (read the upgrade guide).
    ignore:
      - dependency-name: next
        update-types: [version-update:semver-major]
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: better-auth
        update-types: [version-update:semver-major]
      - dependency-name: drizzle-orm
        update-types: [version-update:semver-major]
      # Blocked upstream (Oct 2026): typescript-eslint doesn't support TS 7 and
      # eslint-plugin-react (via eslint-config-next) breaks on ESLint 10.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      # Node types must match the runtime (Node 24 LTS in Docker, CI and dev).
      # Upgrade Node as one change across Dockerfile, CI and @types/node.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Jakarta
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Jakarta
    ignore:
      # Stay on the Node 24 LTS line; CI does not build the image, so a major
      # Node bump must be a deliberate change together with CI and @types/node.
      - dependency-name: node
        update-types: [version-update:semver-major]
